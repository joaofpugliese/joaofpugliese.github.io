<script>
async function loadFileList() {
    try {
        // Load file list from JSON
        const response = await fetch('./files.json');
        const fileList = await response.json();
        
        // Sort files by date (newest first)
        const sortedFiles = fileList.sort((a, b) => {
            const dateA = extractDateFromFilename(a);
            const dateB = extractDateFromFilename(b);
            return dateB - dateA;
        });
        
        displayFiles(sortedFiles);
    } catch (error) {
        console.error('Error loading file list:', error);
        
        // Fallback to hardcoded list
        const fallbackFiles = [
            'transfer_to_server_20250828_110615.zip',
            'transfer_to_server_20250827_114336.zip'
        ];
        
        displayFiles(fallbackFiles.sort((a, b) => {
            const dateA = extractDateFromFilename(a);
            const dateB = extractDateFromFilename(b);
            return dateB - dateA;
        }));
    }
}

function extractDateFromFilename(filename) {
    const match = filename.match(/transfer_to_server_(\d{8})_(\d{6})\.zip/);
    if (!match) return new Date(0);
    
    const dateStr = match[1]; // YYYYMMDD
    const timeStr = match[2]; // HHMMSS
    
    const year = parseInt(dateStr.substring(0, 4));
    const month = parseInt(dateStr.substring(4, 6)) - 1; // Month is 0-indexed
    const day = parseInt(dateStr.substring(6, 8));
    const hour = parseInt(timeStr.substring(0, 2));
    const minute = parseInt(timeStr.substring(2, 4));
    const second = parseInt(timeStr.substring(4, 6));
    
    return new Date(year, month, day, hour, minute, second);
}

function formatDate(date) {
    const months = ['January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];
    
    const month = months[date.getMonth()];
    const day = date.getDate().toString().padStart(2, '0');
    const year = date.getFullYear();
    const hour = date.getHours().toString().padStart(2, '0');
    const minute = date.getMinutes().toString().padStart(2, '0');
    const second = date.getSeconds().toString().padStart(2, '0');
    
    return `${month} ${day}, ${year} at ${hour}:${minute}:${second}`;
}

function displayFiles(files) {
    const latestSection = document.getElementById('latest-section');
    const previousSection = document.getElementById('previous-section');
    
    if (files.length === 0) {
        latestSection.innerHTML = '<p style="color: #6a737d; font-style: italic;">No zip files found.</p>';
        return;
    }
    
    // Latest file
    const latestFile = files[0];
    const latestDate = extractDateFromFilename(latestFile);
    latestSection.innerHTML = `
        <div class="file-item">
            <div class="file-info">
                <a href="./${latestFile}" class="file-name">${latestFile}</a>
                <div class="file-date">📅 Uploaded: ${formatDate(latestDate)}</div>
            </div>
            <a href="./${latestFile}" class="download-btn">Download</a>
        </div>
    `;
    
    // Previous files
    if (files.length > 1) {
        const previousFiles = files.slice(1);
        previousSection.innerHTML = previousFiles.map(file => {
            const date = extractDateFromFilename(file);
            return `
                <div class="file-item">
                    <div class="file-info">
                        <a href="./${file}" class="file-name">${file}</a>
                        <div class="file-date">📅 Uploaded: ${formatDate(date)}</div>
                    </div>
                    <a href="./${file}" class="download-btn">Download</a>
                </div>
            `;
        }).join('');
    } else {
        previousSection.innerHTML = '<p style="color: #6a737d; font-style: italic;">No previous uploads yet. Future uploads will appear here automatically.</p>';
    }
}

// Load files when page loads
document.addEventListener('DOMContentLoaded', loadFileList);
</script>
