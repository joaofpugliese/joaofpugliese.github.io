<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Dummies</title>
  <!-- Default: processed_dummies_4_by_25.svg (4x25, N=100). Alt: processed_dummies_5_by_20.svg (5x20, same N). -->
  <!-- Qualtrics iframe padding-top: 4x25 -> ~26.2% (39.6/151.2); 5x20 -> ~40.6% (49.2/121.2 if using padded 5x20 SVG). -->
  <style>
    html, body { margin:0; padding:0; overflow:hidden; line-height:0; }
  </style>
</head>
<body>
  <embed id="dummiesSvg" src="processed_dummies_4_by_25.svg" type="image/svg+xml" style="width:100%; height:auto; max-height:100%; border:none; display:block; vertical-align:top;">

  <script>
  (function () {
    let svgReady = false;
    const queue = [];

    function shuffleArray(arr) {
      let cur = arr.length, tmp, rand;
      while (cur) {
        rand = Math.floor(Math.random() * cur--);
        tmp = arr[cur];
        arr[cur] = arr[rand];
        arr[rand] = tmp;
      }
      return arr;
    }

    function isLayered(grp) {
      return !!grp.querySelector(".dummy-base");
    }

    function clearDummyCommitted(grp) {
      grp.querySelectorAll("path").forEach(function (p) {
        p.removeAttribute("stroke");
        p.removeAttribute("stroke-width");
        p.removeAttribute("paint-order");
        p.removeAttribute("vector-effect");
      });
    }

    function setDummyCommitted(grp, on) {
      if (!on) {
        clearDummyCommitted(grp);
        return;
      }
      grp.querySelectorAll("path").forEach(function (p) {
        p.setAttribute("stroke", "#1a1a1a");
        p.setAttribute("stroke-width", "0.5");
        p.setAttribute("paint-order", "stroke fill");
        p.setAttribute("vector-effect", "non-scaling-stroke");
      });
    }

    function setDummyEmpty(grp) {
      clearDummyCommitted(grp);
      if (!isLayered(grp)) {
        grp.setAttribute("fill", "#d9d9d9");
        return;
      }
      grp.querySelectorAll(".dummy-base path").forEach(function (p) { p.setAttribute("fill", "#d9d9d9"); });
      grp.querySelector(".dummy-green").setAttribute("style", "clip-path: inset(0 100% 0 0);");
      grp.querySelector(".dummy-yellow").setAttribute("style", "clip-path: inset(0 0 0 100%);");
    }

    function setDummySolidColor(grp, color) {
      clearDummyCommitted(grp);
      if (!isLayered(grp)) {
        grp.setAttribute("fill", color);
        return;
      }
      grp.querySelectorAll(".dummy-base path").forEach(function (p) { p.setAttribute("fill", color); });
      grp.querySelector(".dummy-green").setAttribute("style", "clip-path: inset(0 100% 0 0);");
      grp.querySelector(".dummy-yellow").setAttribute("style", "clip-path: inset(0 0 0 100%);");
    }

    function setDummyGreen(grp, hex) {
      hex = hex || "#18910b";
      clearDummyCommitted(grp);
      if (!isLayered(grp)) {
        grp.setAttribute("fill", hex);
        return;
      }
      grp.querySelectorAll(".dummy-base path").forEach(function (p) { p.setAttribute("fill", "#d9d9d9"); });
      var gr = grp.querySelector(".dummy-green");
      gr.querySelectorAll("path").forEach(function (p) { p.setAttribute("fill", hex); });
      gr.setAttribute("style", "clip-path: inset(0 0 0 0);");
      grp.querySelector(".dummy-yellow").setAttribute("style", "clip-path: inset(0 0 0 100%);");
    }

    function setDummyYellow(grp, hex) {
      hex = hex || "#ffbb0c";
      clearDummyCommitted(grp);
      if (!isLayered(grp)) {
        grp.setAttribute("fill", hex);
        return;
      }
      grp.querySelectorAll(".dummy-base path").forEach(function (p) { p.setAttribute("fill", "#d9d9d9"); });
      var yl = grp.querySelector(".dummy-yellow");
      yl.querySelectorAll("path").forEach(function (p) { p.setAttribute("fill", hex); });
      yl.setAttribute("style", "clip-path: inset(0 0 0 0);");
      grp.querySelector(".dummy-green").setAttribute("style", "clip-path: inset(0 100% 0 0);");
    }

    /** Integer 0–100: green from left, yellow from right (artifact6-style clips). */
    function setDummyPartial(grp, pGreen) {
      clearDummyCommitted(grp);
      if (!isLayered(grp)) return;
      var r = 100 - pGreen;
      grp.querySelectorAll(".dummy-base path").forEach(function (p) { p.setAttribute("fill", "#d9d9d9"); });
      var gr = grp.querySelector(".dummy-green");
      var yl = grp.querySelector(".dummy-yellow");
      gr.querySelectorAll("path").forEach(function (p) { p.setAttribute("fill", "#18910b"); });
      yl.querySelectorAll("path").forEach(function (p) { p.setAttribute("fill", "#ffbb0c"); });
      gr.setAttribute("style", "clip-path: inset(0 " + r + "% 0 0);");
      yl.setAttribute("style", "clip-path: inset(0 0 0 " + pGreen + "%);");
    }

    function paint(data) {
      var svgDoc = document.getElementById("dummiesSvg").getSVGDocument();
      var groups = Array.from(svgDoc.querySelectorAll("g[id^='dummy-']"));

      if (data.action === "lightUpBlack") {
        groups.forEach(function (g, i) {
          setDummySolidColor(g, i < data.numLit ? "#000000" : "#d9d9d9");
        });
      } else if (data.action === "lightUpGray") {
        groups.forEach(function (g, i) {
          setDummySolidColor(g, i < data.numLit ? "#444444" : "#d9d9d9");
        });
      } else if (data.action === "fillInitial") {
        var gCount = data.prevGreenCount;
        var bCount = data.newBlackCount;
        var yCount = data.prevYellowCount;
        groups.forEach(function (grp, i) {
          var committed = (i < gCount) || (i >= gCount + bCount && i < gCount + bCount + yCount);
          if (i < gCount) {
            setDummyGreen(grp, "#175c10");
          } else if (i < gCount + bCount) {
            setDummySolidColor(grp, "#000000");
          } else if (i < gCount + bCount + yCount) {
            setDummyYellow(grp, "#d99e04");
          } else {
            setDummyEmpty(grp);
          }
          setDummyCommitted(grp, committed);
        });
      } else if (data.action === "fillRandom") {
        var total = data.greenCount + data.yellowCount;
        var region = groups.slice(0, total);
        var idxs = shuffleArray(Array.from({ length: total }, function (_, j) { return j; }));
        var gSet = new Set(idxs.slice(0, data.greenCount));
        var ySet = new Set(idxs.slice(data.greenCount));
        region.forEach(function (g, i) {
          if (gSet.has(i)) setDummyGreen(g, "#18910b");
          else if (ySet.has(i)) setDummyYellow(g, "#ffbb0c");
        });
        groups.slice(total).forEach(function (g) { setDummyEmpty(g); });
      } else if (data.action === "fillSequential") {
        var gC = data.greenCount;
        var yC = data.yellowCount;
        var p = data.boundaryPartialPct;
        var hasPart = typeof p === "number" && p > 0 && p < 100;
        groups.forEach(function (grp, i) {
          if (i < gC) {
            setDummyGreen(grp, "#18910b");
          } else if (hasPart && i === gC) {
            if (isLayered(grp)) setDummyPartial(grp, p);
            else if (p >= 50) setDummyGreen(grp, "#18910b");
            else setDummyYellow(grp, "#ffbb0c");
          } else if (!hasPart && i < gC + yC) {
            setDummyYellow(grp, "#ffbb0c");
          } else if (hasPart && i > gC && i <= gC + yC) {
            setDummyYellow(grp, "#ffbb0c");
          } else {
            setDummyEmpty(grp);
          }
        });
      } else if (data.action === "fillRandom2") {
        var offset = data.prevGreenCount;
        var length = data.newBlackCount;
        var region = groups.slice(offset, offset + length);
        var idxs2 = shuffleArray(Array.from({ length: length }, function (_, j) { return j; }));
        var gSet2 = new Set(idxs2.slice(0, data.greenCount));
        var ySet2 = new Set(idxs2.slice(data.greenCount));
        region.forEach(function (g, i) {
          if (gSet2.has(i)) setDummyGreen(g, "#18910b");
          else if (ySet2.has(i)) setDummyYellow(g, "#ffbb0c");
          else setDummySolidColor(g, "#000000");
        });
        for (var pi = 0; pi < offset; pi++) {
          setDummyCommitted(groups[pi], true);
        }
      } else if (data.action === "fillSequential2") {
        var off = data.prevGreenCount;
        var len = data.newBlackCount;
        var region2 = groups.slice(off, off + len);
        var newG = data.greenCount - data.prevGreenCount;
        var newY = data.yellowCount - data.prevYellowCount;
        region2.forEach(function (g, i) {
          if (i < newG) setDummyGreen(g, "#18910b");
          else if (i < newG + newY) setDummyYellow(g, "#ffbb0c");
          else setDummySolidColor(g, "#000000");
        });
        for (var pj = 0; pj < off; pj++) {
          setDummyCommitted(groups[pj], true);
        }
      }
    }

    function tryFlush() {
      var embed = document.getElementById("dummiesSvg");
      if (!embed) return;
      var svgDoc = embed.getSVGDocument();
      if (!svgDoc) return;

      if (!svgReady) {
        svgReady = true;
        clearInterval(poller);
      }
      while (queue.length) {
        paint(queue.shift());
      }
    }

    var poller = setInterval(tryFlush, 100);
    var embedEl = document.getElementById("dummiesSvg");
    if (embedEl) embedEl.addEventListener("load", tryFlush);

    function isAllowedOrigin(origin) {
      if (origin === "null") {
        return true;
      }
      try {
        var u = new URL(origin);
        if (u.hostname === "localhost" || u.hostname === "127.0.0.1") {
          return u.protocol === "http:" || u.protocol === "https:";
        }
        return u.protocol === "https:" &&
          (u.hostname === "qualtrics.com" || u.hostname.endsWith(".qualtrics.com"));
      } catch (e) { return false; }
    }

    function onParentMessage(event) {
      if (!isAllowedOrigin(event.origin)) return;
      var data = event.data;
      if (!data || typeof data !== "object" || !("action" in data)) return;

      switch (data.action) {
        case "lightUpBlack":
        case "lightUpGray":
        case "fillInitial":
        case "fillRandom":
        case "fillSequential":
        case "fillRandom2":
        case "fillSequential2":
          if (svgReady) {
            paint(data);
          } else {
            queue.push(data);
            tryFlush();
          }
          break;
        default:
          break;
      }
    }

    window.addEventListener("message", onParentMessage, { passive: true });
    window.parent.postMessage({ action: "iframeReady" }, "*");
  })();
  </script>
</body>
</html>
