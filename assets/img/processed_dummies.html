<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dummies</title>
    <style>
        html, body { margin:0; padding:0; overflow:hidden; }
    </style>
</head>
<body>
    <embed id="dummiesSvg" src="processed_dummies_5_by_40.svg" type="image/svg+xml" style="width:100%; height:auto; border:none; display:block;">

    <script>
    window.addEventListener("message", function(event) {
        // accept messages only from your Qualtrics origin
        if (event.origin !== "https://stanforduniversity.qualtrics.com") return;

        const data = event.data;
        const svgDoc = document.getElementById("dummiesSvg")?.getSVGDocument();
        if (!svgDoc) { console.error("SVG embed not ready."); return; }

        if (data.action === "lightUpBlack") {
            for (let i = 1; i <= 200; i++) {
                const grp = svgDoc.getElementById("dummy-" + i);
                if (grp) grp.setAttribute("fill", i <= data.numLit ? "black" : "#d9d9d9");
            }
        }
        if (data.action === "fillRandom") {
            const green = new Set(data.greenIndices);
            const yellow = new Set(data.yellowIndices);
            groups.forEach((grp, i) => {
            if (green.has(i))       grp.setAttribute("fill", "#18910b");
            else if (yellow.has(i)) grp.setAttribute("fill", "#ffbb0c");
            else                    grp.setAttribute("fill", "#d9d9d9");
            });
        }
        if (data.action === "fillSequential") {
            const gCount = data.greenCount;
            const yCount = data.yellowCount;
            const total  = gCount + yCount;
            groups.forEach((grp, i) => {
            if (i < gCount)             grp.setAttribute("fill", "#18910b");
            else if (i < total)         grp.setAttribute("fill", "#ffbb0c");
            else                        grp.setAttribute("fill", "#d9d9d9");
            });
        }
    });
    </script>
</body>
</html>
