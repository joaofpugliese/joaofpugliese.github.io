
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dummies</title>
    <style>
        html, body { margin:0; padding:0; overflow:hidden; }
    </style>
</head>
<body>
    <embed id="dummiesSvg" src="processed_dummies_5_by_40.svg" type="image/svg+xml" style="width:100%; height:auto; border:none; display:block;">

        <script>
            (function() {
              const VALID_ORIGIN = "qualtrics.com";
              let svgReady = false;
              const queue = [];
            
              function shuffleArray(arr) {
                let cur = arr.length, tmp, rand;
                while (cur) {
                  rand = Math.floor(Math.random() * cur--);
                  tmp = arr[cur];
                  arr[cur] = arr[rand];
                  arr[rand] = tmp;
                }
                return arr;
              }
            
              function paint(data) {
                const svgDoc = document.getElementById("dummiesSvg").getSVGDocument();
                const groups = Array.from(svgDoc.querySelectorAll("g[id^='dummy-']"));
            
                if (data.action === "lightUpBlack") {
                  groups.forEach((g,i) =>
                    g.setAttribute("fill", i < data.numLit ? "black" : "#d9d9d9")
                  );
                }
              }
            
              function tryFlush() {
                const embed = document.getElementById("dummiesSvg");
                if (!embed) return;
                const svgDoc = embed.getSVGDocument();
                if (!svgDoc) return;
            
                if (!svgReady) {
                  svgReady = true;
                  clearInterval(poller);
                  // console.log("✔ SVG ready — flushing queued messages:", queue.length);
                }
            
                // Always process everything in the queue
                while (queue.length) {
                  paint(queue.shift());
                }
              }
            
              // Poll fallback
              const poller = setInterval(tryFlush, 100);
            
              // Attempt to flush on embed’s load event (where supported)
              const embedEl = document.getElementById("dummiesSvg");
              if (embedEl) embedEl.addEventListener("load", tryFlush);
            
              // Main listener
              window.addEventListener("message", event => {
                console.log("📩 message from", event.origin, event.data);
                if (!event.origin.includes(VALID_ORIGIN)) {
                  console.warn("Ignored origin", event.origin);
                  return;
                }
            
                if (svgReady) {
                  // If we already know the SVG is loaded, paint immediately
                  paint(event.data);
                } else {
                  // Otherwise queue + attempt a flush
                  queue.push(event.data);
                  tryFlush();
                }
              }, false);
            
              console.log("🔧 Dummies listener initialized");
            })();
            </script>
                
</body>
</html>
