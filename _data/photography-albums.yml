# Photography Albums Configuration
# ================================
# Add your photo albums here. Each album will appear on the main photography page.
#
# Required fields:
#   - title: The album name displayed on the card
#   - slug: URL-friendly identifier (used in URL: /photography/[slug]/)
#   - date: When the photos were taken
#   - location: Where the photos were taken
#   - photo_count: Number of photos in the album
#
# Optional fields:
#   - description: A brief description shown on the album page
#   - layout: 'grid', 'masonry', or 'horizontal-strips' (default: grid)

# Active albums:

- title: "Example Album"
  slug: example-album
  date: "January 2025"
  location: "Your Location"
  photo_count: 3
  description: "This is an example album to demonstrate the photography gallery."
  layout: grid

