- id: customized-sliders
  title: Simple Customizable Sliders
  functionality: JavaScript
  summary: Customizable sliders preserving native Qualtrics styles. Good to set up slider with personalized maximum/minimum values and change display values.
  long_description: >
    This script creates a custom Qualtrics sliders, preserving native styling. It works by recreating a slider using the exact structure from Qualtrics, which makes CSS styles apply to the created slider. You want to set a Text/Graphic question type and add this script as JavaScript. It allows you to customize the slider's maximum and minimum values, places where you display values, and save the selected value as Embedded Data. The script also includes customization of visual elements following Qualtrics standard choices in a Slider question. No HTML is needed, just the JavaScript. It does not support adding images to the slider, though it supports emojis. Tested for the new Simple Layout Qualtrics theme -- be aware that embedded data saved must be preffixed by "__js_". Importantly, the 
  files:
    - customized-slider-qualtrics-graphics-js.txt
  has_download: true

- id: constant-sum-sliders
  title: Constant Sum Sliders
  functionality: JavaScript
  summary: Constant-sum set of sliders keeping native Qualtrics styles. Better implementation of the Constant Sum question type for Simple Layout -- sliders are disabled for this theme at the moment. Similar to "Balls and Bins" style of questions for allocation.
  long_description: >
    This script creates a constant sum slider, useful for allocation problems without requiring participants to type. It lets you select categories and maximum allocation values that generate a set of sliders with a constant sum. Useful for time-allocation or belief elicitation questions. The Next button is disabled until the sum of the sliders equals the maximum value. You can customize to choose to "clamp" or "proportional"ly adjust the sliders once they reach the maximum allowed value. Choices are stored as embedded data using a prefix followed by the index of the choice -- e.g., for 4 sliders and a prefix of "choice", the embedded data becomes "choice1", ..., "choice4". Tested for the new Simple Layout Qualtrics theme -- be aware that embedded data saved must be preffixed by "__js_".
  files:
    - constant-sum-slider-qualtrics-graphics-js.txt
  has_download: true

- id: youtube_video_with_trackers
  title: Embedding YouTube Video with Trackers
  functionality: JavaScript, HTML
  summary: Embed a YouTube video with trackers to measure time spent on the video.
  long_description: >
    This script allows you to embed a YouTube video in a Qualtrics survey and track the time spent on the video. It uses the YouTube IFrame API to control the video playback and send tracking data to Qualtrics. The script includes functions to start and stop tracking when the video is played or paused, and it sends the tracking data as embedded data to Qualtrics. The script also includes a function to handle the end of the video and send the final tracking data. This script is useful for surveys that include video content and want to measure participant engagement with the video. You have to add the HTML code to the question body and the JavaScript code to the question's JavaScript section. The video ID must be specified in the HTML code. Also useful if you want to randomize videos and send the ID through Embedded Data.
    
    <h4>Summary of the Embedded Data Saved</h4>
    <table>
      <thead>
        <tr><th>Embedded Data</th><th>Meaning</th></tr>
      </thead>
      <tbody>
        <tr><td><code>WatchedVideoID</code></td><td>ID of video watched</td></tr>
        <tr><td><code>MaxTimeWatched</code></td><td>Farthest timestamp reached</td></tr>
        <tr><td><code>TotalTimeWatched</code></td><td>Total accumulated time playing</td></tr>
        <tr><td><code>JumpDetected</code></td><td>If a jump/skipping behavior was detected</td></tr>
        <tr><td><code>JumpFromWhen1</code>, <code>JumpToWhen1</code>, etc.</td><td>Timestamps of skips (up to 5 skips)</td></tr>
        <tr><td><code>VolumeEvent1</code>, <code>VolumeTime1</code>, etc.</td><td>Mute/Unmute events and when they happened (up to 5)</td></tr>
        <tr><td><code>QualityChange1</code>, <code>QualityTime1</code>, etc.</td><td>Quality change events (up to 5)</td></tr>
        <tr><td><code>VideoStatus</code></td><td>Final status of the video ("Ended" or not)</td></tr>
      </tbody>
  files:
    - video-embedding-html.txt
    - video-embedding-js.txt
  has_download: true  

- id: slider-dynamic-iframe
  title: Slider-Controlled Dummy Visualization
  functionality: JavaScript, HTML
  summary: Connects a Qualtrics slider to an iframe display that lights up dummy figures as the slider moves. Helps respondents visualize quantities easily.
  long_description: >
    This script links a standard Qualtrics slider to a custom iframe visualization showing 1,000 dummy figures. As the respondent moves the slider, the script lights up one figure for every N units (e.g., every 5 units in the slider), offering a visual way to express estimates or beliefs. It uses `postMessage` to send data from the slider to the iframe hosted externally. This makes it easier for participants to engage with abstract numbers by visualizing them as people being selected. The script includes safeguards to check if the slider and iframe are correctly loaded. You can customize the number of total figures (`numDummies`) and the step size for when each new figure lights up. Works with the Simple Layout in Qualtrics. 

    This requires a website (e.g., a personal website hosted on GitHub) to host the HTML.
  files:
    - slider-dummy-question-html.txt
    - slider-dummy-js.txt
    - slider-dummy-external-html.txt
  has_download: true  